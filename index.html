<head>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='1.5' fill='%23fff' stroke='%23000' stroke-width='1.2'/%3E%3Cline x1='4.5' y1='4.5' x2='11.5' y2='4.5' stroke='%23000'/%3E%3Cline x1='4.5' y1='7' x2='11.5' y2='7' stroke='%23000'/%3E%3Cline x1='4.5' y1='9.5' x2='9' y2='9.5' stroke='%23000'/%3E%3C/svg%3E">
<script>
(function () {
  var r = document.documentElement, s = null;
  try { s = JSON.parse(localStorage.getItem('ote-settings') || 'null'); } catch (e) {}
  if (!s) {
    var t = null;
    try { t = localStorage.getItem('ote-theme'); } catch (e) {}
    if (t === 'classic') s = { theme: 'classic' };
    else if (t === 'dark') s = { theme: 'custom', editor: 'dark', sameFooter: true, footer: 'dark' };
    else if (t === 'dark-footer') s = { theme: 'custom', editor: 'parchment', sameFooter: false, footer: 'dark' };
    else if (t === 'light') s = { theme: 'custom', editor: 'parchment', sameFooter: false, footer: 'light' };
    else s = {};
  }
  if (s.theme === 'classic') {
    r.setAttribute('data-theme', 'classic');
  } else {
    r.setAttribute('data-theme', 'custom');
    r.setAttribute('data-editor', s.editor === 'light' || s.editor === 'dark' ? s.editor : 'parchment');
    var ef = s.sameFooter === false ? (s.footer || 'light') : (s.editor || 'parchment');
    if (ef !== 'light' && ef !== 'dark') ef = 'parchment';
    r.setAttribute('data-footer', ef);
  }
})();
</script>
<style>
:root{--bg:#fff;--page-color:#000;--editor-bg:#eee8aa;--editor-border:1px dotted #000;--editor-border-bottom:0;--editor-color:#000;--bar-bg:#f7f7f7;--bar-border-top:1px solid #e3e3e3;--bar-color:#222;--bar-font:"Helvetica Neue",Helvetica,Arial,sans-serif;--bar-font-size:13.5px;--bar-padding:7px 12px;--bar-gap:6px;--btn-bg:#fff;--btn-border:1px solid #cfcfcf;--btn-color:#222;--btn-radius:6px;--btn-padding:6px 14px;--btn-hover-bg:#f0f0f0;--btn-hover-border:#b9b9b9;--link-color:#333;--link-hover-bg:#e9e9e9;--icon-radius:6px;--menu-bg:#fff;--menu-border:1px solid #dcdcdc;--menu-radius:8px;--menu-shadow:0 6px 16px rgba(0,0,0,.10);--menu-color:#333;--menu-hover-bg:#f0f0f0;--menu-item-padding:4px 8px;--menu-item-radius:5px;--credit-color:#8a8a8a;--focus:#7aa7ff}

:root[data-footer=light]{--bar-bg:#f7f7f7;--bar-border-top:1px solid #e3e3e3;--bar-color:#222;--btn-bg:#fff;--btn-border:1px solid #cfcfcf;--btn-color:#222;--btn-hover-bg:#f0f0f0;--btn-hover-border:#b9b9b9;--link-color:#333;--link-hover-bg:#e9e9e9;--menu-bg:#fff;--menu-border:1px solid #dcdcdc;--menu-color:#333;--menu-hover-bg:#f0f0f0;--credit-color:#8a8a8a;--focus:#7aa7ff}
:root[data-footer=dark]{--bar-bg:#191a1d;--bar-border-top:1px solid #2c2d31;--bar-color:#d4d4d4;--btn-bg:#252629;--btn-border:1px solid #3a3b3f;--btn-color:#dcdcdc;--btn-hover-bg:#2d2e32;--btn-hover-border:#4a4b50;--link-color:#c8c8c8;--link-hover-bg:#2a2b2f;--menu-bg:#151619;--menu-border:1px solid #2c2d31;--menu-color:#d4d4d4;--menu-hover-bg:#242528;--menu-shadow:0 6px 16px rgba(0,0,0,.55);--credit-color:#7d7d7d;--focus:#9a9a9a}
:root[data-theme=classic]{--bg:#fff;--page-color:#000;--editor-bg:#eee8aa;--editor-border:1px dotted #000;--editor-border-bottom:1px dotted #000;--editor-color:#000;--bar-bg:transparent;--bar-border-top:0;--bar-color:#000;--bar-padding:0 4px 16px;--bar-gap:0;--link-color:#00e;--link-hover-bg:transparent;--icon-radius:0;--menu-bg:#fff;--menu-border:1px solid #369;--menu-radius:0;--menu-shadow:none;--menu-color:#000;--menu-hover-bg:transparent;--menu-item-padding:0;--menu-item-radius:0;--credit-color:#000;--focus:#00e}

.toolbar .btn:hover{background:var(--btn-hover-bg);border-color:var(--btn-hover-border)}
.toolbar .btn:active{background:var(--btn-hover-bg)}

.toolbar a.q:hover{background:var(--link-hover-bg)}
.toolbar a.icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;font-size:14px;line-height:1}

.dd{position:relative;display:inline-block}

.menu{display:none;position:absolute;right:0;bottom:calc(100% + 8px);background:var(--menu-bg);border:var(--menu-border);border-radius:var(--menu-radius);box-shadow:var(--menu-shadow);padding:6px;min-width:160px;white-space:nowrap;text-align:left;z-index:1000;font-family:var(--bar-font);font-size:var(--bar-font-size);color:var(--menu-color)}

.menu a.q,.theme-opt{display:block;width:100%;box-sizing:border-box;padding:var(--menu-item-padding);border:0;border-radius:var(--menu-item-radius);background:transparent;color:var(--menu-color);font:inherit;text-align:left;cursor:pointer}

:root:not([data-theme=classic]) .classic-only{display:none!important}
:root[data-theme=classic] .non-classic{display:none!important}
:root[data-theme=classic] .counts{display:none}

/* Theme settings panel (custom theme only) */
.tp{min-width:210px}
.tp-group{margin:0 0 7px}
.tp-group:last-child{margin:0}
.tp-group[hidden]{display:none!important}
.tp-label{font-size:11px;letter-spacing:.02em;color:var(--credit-color);margin:0 0 4px 2px}
.tp-opt{display:inline-block;padding:4px 10px;margin:0 4px 4px 0;border:var(--btn-border);border-radius:var(--btn-radius);background:var(--btn-bg);color:var(--btn-color);font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.tp-opt:hover{background:var(--btn-hover-bg);border-color:var(--btn-hover-border)}
.tp-opt[aria-pressed=true]{background:var(--btn-hover-bg);border-color:var(--btn-hover-border);font-weight:600}
.tp-opt[aria-pressed=true]::after{content:"\2713";margin-left:5px;opacity:.65}
.tp-opt:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tp-check{display:flex;align-items:center;gap:6px;padding:2px;cursor:pointer;user-select:none}
.tp-check input{accent-color:var(--focus);margin:0}

.menu-close{display:none}
:root[data-theme=classic] .menu-close{display:inline}
:root[data-theme=classic] .menu-close img{display:inline;vertical-align:top;border:0}

:root[data-theme=classic] #text{padding:2px;font:13.3333px monospace}
:root[data-theme=classic] .toolbar{display:block;font-family:inherit;font-size:inherit}
:root[data-theme=classic] .toolbar>*+*{margin-left:4px}
:root[data-theme=classic] .toolbar .btn{all:revert}
:root[data-theme=classic] .toolbar a.q{color:#00e;text-decoration:underline}
:root[data-theme=classic] .toolbar a.icon{display:inline;width:auto;height:auto;font-size:inherit;line-height:normal;padding:0;text-decoration:none}
:root[data-theme=classic] .dd>a.q{padding:0}
:root[data-theme=classic] .menu{right:0;bottom:130%;width:16ex;min-width:0;line-height:1.9;padding:0 0 .5ex .8ex;border-radius:0;box-shadow:none;font-family:inherit;font-size:inherit}
:root[data-theme=classic] .menu a.q,
:root[data-theme=classic] .theme-opt{display:block;padding:0;color:#00e;font-weight:400;background:transparent;text-decoration:underline}
:root[data-theme=classic] .copy-cut{display:block}
:root[data-theme=classic] .copy-cut a.q{display:inline;width:auto}
:root[data-theme=classic] .theme-opt[aria-pressed=true]{font-weight:700}
:root[data-theme=classic] .theme-opt::after{content:"";width:auto}
:root[data-theme=classic] .theme-opt[aria-pressed=true]::after{content:" \2713"}
:root[data-theme=classic] .credit{position:fixed;bottom:12px;right:2px;margin:0;padding:0;font:11px Arial,Helvetica,sans-serif;letter-spacing:normal;color:#000}

@media (max-width:640px){
form{flex-direction:column-reverse;height:var(--vvh,100%)}

#text{font-size:16px;padding:8px;border-bottom:var(--editor-border)}
.toolbar a.icon{width:34px;height:34px;font-size:16px}
.dd>a.q{padding:8px 10px}
.credit,.counts{font-size:10px}.credit{padding-left:8px}
.menu,:root[data-theme=classic] .menu{top:calc(100% + 8px);bottom:auto}
.menu a.q,.theme-opt,.tp-opt{padding:8px}
:root[data-theme=classic] #text{font-size:16px;padding:8px}
:root[data-theme=classic] .toolbar{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:0}
:root[data-theme=classic] .menu a.q,:root[data-theme=classic] .theme-opt{padding:8px}
:root[data-theme=classic] .copy-cut a.q{padding:8px 4px}
}
</style>

<body>
<form id="textform" onsubmit="return false">
<textarea id="text" name="text" spellcheck="true">Welcome to Online Text Editor - your online plain text editor. Enter or paste your text here. To download and save it, click on the button below.</textarea>
<div class="toolbar">
<input type="button" class="btn classic-only" value="Download &amp; Save" title="Download &amp; Save" data-a="download">
<input type="button" class="btn non-classic" value="Export" title="Export (Ctrl+S)" data-a="download">
<input type="button" class="btn non-classic" value="Import" title="Import a text file" data-a="import">
<a class="q icon classic-only" href="#" title="Scroll to Top" data-a="top">&uarr;</a>
<a class="q icon classic-only" href="#" title="Scroll to Bottom" data-a="bottom">&darr;</a>
<span class="dd classic-only">
<a class="q" href="#" rel="nofollow" title="More Options" data-a="menu" data-m="more-menu">more&nbsp;&raquo;</a>
<span class="menu" id="more-menu">
<a href="#" class="menu-close" data-a="close-menu" title="Close"><img border="0" src="https://web.archive.org/web/20251231173911im_/https://www.onlinetexteditor.com/images/x2.gif" width="12" height="12" alt="Close menu" align="right" class="cb"></a>
<a class="q" href="#" title="New Layout" data-a="new-layout">New Layout</a>
<div class="copy-cut"><a class="q" href="#" title="Copy to Clipboard" data-a="copy">Copy</a> or <a class="q" href="#" title="Cut to Clipboard" data-a="cut">Cut</a></div>
<a class="q" href="#" title="Word Count" data-a="words">Word Count</a>
<a class="q" href="#" title="Character Count" data-a="chars">Character Count</a>

</span>
</span>
<span class="dd non-classic">
<a class="q" href="#" rel="nofollow" title="Customise" data-a="menu" data-m="theme-menu">customise&nbsp;&raquo;</a>
<span class="menu" id="theme-menu">
<a href="#" class="menu-close" data-a="close-menu" title="Close"><img border="0" src="https://web.archive.org/web/20251231173911im_/https://www.onlinetexteditor.com/images/x2.gif" width="12" height="12" alt="Close menu" align="right" class="cb"></a>
<div class="tp">
<div class="tp-group">
<div class="tp-label">Layout</div>

</div>

<button type="button" class="tp-opt" data-editor-opt="light">Light</button>
<button type="button" class="tp-opt" data-editor-opt="dark">Dark</button>
</div>

</div>

</div>
</span>
</span>

</div>
<input type="file" id="fileInput" accept=".txt,.text,.md,.markdown,.csv,.tsv,.log,.json,.xml,.html,.htm,.css,.js,.mjs,.ts,.tsx,.jsx,.ini,.cfg,.conf,.yaml,.yml,.toml,.env,.sh,.bat,.py,.rb,.java,.c,.cpp,.h,.go,.rs,.php,.sql,text/*,application/json,application/xml,application/javascript" hidden>
</form>
<script>
(function () {
  var doc = document, root = doc.documentElement;
  var ta = doc.getElementById('text'), counts = doc.getElementById('counts');
  var fileInput = doc.getElementById('fileInput');
  var defaultText = ta.value;
  var SETTINGS_KEY = 'ote-settings';

  function closeMenus() {
    var m = doc.querySelectorAll('.menu.open');
    for (var i = 0; i < m.length; i++) m[i].classList.remove('open');
  }

  function isWs(c) {
    return c <= 32 || c === 160 || c === 0x1680 || (c >= 0x2000 && c <= 0x200a) ||
           c === 0x2028 || c === 0x2029 || c === 0x202f || c === 0x205f || c === 0x3000 || c === 0xfeff;
  }
  function wordCount(v) {
    var n = 0, inW = false;
    for (var i = 0, l = v.length; i < l; i++) {
      if (isWs(v.charCodeAt(i))) inW = false;
      else if (!inW) { inW = true; n++; }
    }
    return n;
  }

  function isClassic() { return root.getAttribute('data-theme') === 'classic'; }

  function download() {
    var url = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain;charset=utf-8' }));
    var a = doc.createElement('a');
    a.href = url; a.download = 'text.txt';
    doc.body.appendChild(a); a.click(); doc.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function popup() {
    var w = window.open('', 'otepopup', 'width=800,height=600,resizable=yes,scrollbars=yes');
    if (!w) { alert('Please allow pop-ups for this site.'); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Online Text Editor</title></head><body style="margin:0"><textarea id="t" spellcheck="true" style="width:100%;height:100vh;box-sizing:border-box;background:#eee8aa;border:1px dotted #000;resize:none;font-family:monospace;font-size:14px;padding:2px"></textarea></body></html>');
    w.document.close();
    var t = w.document.getElementById('t');
    t.value = ta.value; t.focus();
  }

  // Fast file read: Blob.prototype.text() when available, FileReader fallback.
  function importFromFile(file) {
    if (!file) return;
    function done(text) {
      ta.value = text;
      ta.setSelectionRange(0, 0);
      resetHist();
      updateCounts();
      ta.focus();
    }
    function fail(err) {
      alert('Could not read the file' + (err && err.message ? ': ' + err.message : '.'));
    }
    if (file.text) file.text().then(done, fail);
    else {
      var fr = new FileReader();
      fr.onload = function () { done(fr.result); };
      fr.onerror = function () { fail(fr.error); };
      fr.readAsText(file);
    }
  }

  var actions = {
    download: download,
    top: function () { ta.scrollTop = 0; },
    bottom: function () { ta.scrollTop = ta.scrollHeight; },
    /* Classic theme reproduces the original func.js verbatim:
       word count = value.split(" ").length (naive, inflates on repeated spaces),
       char count = value.length (includes whitespace). */
    words: function () {
      if (isClassic()) {
        var n = ta.value.split(" ").length;
        alert("Word Count:\n\nYour document contains about\n\n" + n + " Words");
      } else {
        alert('Words: ' + wordCount(ta.value));
      }
    },
    chars: function () {
      var n = ta.value.length;
      if (isClassic()) {
        alert("Character Count:\n\nYour document contains about\n\n" + n + " Characters (including whitespace)");
      } else {
        alert('Characters: ' + n);
      }
    },
    popup: popup,
    copy: function () {
      var s = ta.selectionStart, e = ta.selectionEnd;
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      ta.setSelectionRange(s, e);
      ta.focus();
    },
    cut: function () {
      var s = ta.selectionStart, e = ta.selectionEnd;
      ta.select();
      var ok = false;
      try { ok = document.execCommand('cut'); } catch (err) {}
      if (ok) ta.setSelectionRange(0, 0);
      else ta.setSelectionRange(s, e);
      ta.focus();
    },
    'import': function () {
      fileInput.value = '';
      fileInput.click();
    },
    'new-layout': function () {
      settings.theme = 'custom';
      applySettings(); saveSettings(); closeMenus();
    },
    'close-menu': function () { closeMenus(); }
  };

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (f) importFromFile(f);
  });

  doc.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a],[data-layout-opt],[data-editor-opt],[data-footer-opt]');
    if (!el) { if (!e.target.closest('.dd')) closeMenus(); return; }
    if (el.tagName === 'A') e.preventDefault();
    if (el.hasAttribute('data-layout-opt')) {
      var lv = el.getAttribute('data-layout-opt');
      if (lv === 'classic') {
        settings.theme = 'classic';
        applySettings(); saveSettings(); closeMenus();
      } else {
        settings.theme = 'custom';
        applySettings(); saveSettings();
      }
      return;
    }
    if (el.hasAttribute('data-editor-opt')) {
      settings.theme = 'custom';
      settings.editor = el.getAttribute('data-editor-opt');
      applySettings(); saveSettings();
      return;
    }
    if (el.hasAttribute('data-footer-opt')) {
      settings.theme = 'custom';
      settings.footer = el.getAttribute('data-footer-opt');
      settings.sameFooter = false;
      applySettings(); saveSettings();
      return;
    }
    var a = el.getAttribute('data-a');
    if (a === 'menu') {
      var m = doc.getElementById(el.getAttribute('data-m')), was = m.classList.contains('open');
      closeMenus();
      if (!was) m.classList.add('open');
      return;
    }
    if (actions[a]) { actions[a](); if (a === 'words' || a === 'chars' || a === 'popup' || a === 'copy' || a === 'cut') closeMenus(); }
  });

  // Ctrl/Cmd + S == Export (download the current text as .txt)
  doc.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      download();
    }
  });

  if (/Mac|iPhone|iPod|iPad/i.test(navigator.platform || navigator.userAgent || '')) {
    var cc = doc.querySelectorAll('.copy-cut');
    for (var i = 0; i < cc.length; i++) cc[i].style.display = 'none';
  }

  var countRaf = 0;
  function renderCounts() {
    countRaf = 0;
    var v = ta.value, w = wordCount(v), c = v.length;
    counts.textContent = w + (w === 1 ? ' word' : ' words') + ' \u00b7 ' + c + (c === 1 ? ' character' : ' characters');
  }
  function updateCounts() {
    if (isClassic() || countRaf) return;
    countRaf = requestAnimationFrame(renderCounts);
  }

  var hist = [], idx = 0, lastKey = '', lastTime = 0, preSel = false, pendType = '', pendData = null;

  function snap() { return { v: ta.value, s: ta.selectionStart, e: ta.selectionEnd }; }
  function resetHist() { hist = [snap()]; idx = 0; lastKey = ''; }

  function keyFor(type, data) {
    if (type === 'insertText' && (!data || data.length === 1)) return 'ins';
    if (type === 'deleteContentBackward') return 'delB';
    if (type === 'deleteContentForward') return 'delF';
    return '';
  }

  function record(key) {
    var st = snap(), top = hist[idx];
    if (st.v === top.v) { top.s = st.s; top.e = st.e; return; }
    var now = Date.now();
    if (key && key === lastKey && !preSel && idx > 0 && idx === hist.length - 1 && now - lastTime < 1000) {
      hist[idx] = st;
    } else {
      hist.length = idx + 1;
      hist.push(st); idx++;
      var max = Math.max(50, Math.min(1000, Math.floor(5e7 / (st.v.length || 1))));
      if (hist.length > max) { hist.splice(0, hist.length - max); idx = hist.length - 1; }
    }
    lastKey = key; lastTime = now;
  }

  function apply(st) {
    ta.value = st.v;
    ta.setSelectionRange(st.s, st.e);
    lastKey = '';
    updateCounts();
  }
  function undo() { if (idx > 0) apply(hist[--idx]); }
  function redo() { if (idx < hist.length - 1) apply(hist[++idx]); }

  ta.addEventListener('beforeinput', function (e) {
    var t = e.inputType;
    if (t === 'historyUndo') { e.preventDefault(); undo(); return; }
    if (t === 'historyRedo') { e.preventDefault(); redo(); return; }
    preSel = ta.selectionStart !== ta.selectionEnd;
    pendType = t; pendData = e.data;
  });
  ta.addEventListener('input', function (e) {
    if (!e.isComposing) record(keyFor(pendType, pendData));
    pendType = ''; pendData = null;
    updateCounts();
  });
  ta.addEventListener('compositionend', function () { record(''); updateCounts(); });

  ta.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Tab') {
      e.preventDefault();
      ta.setRangeText('\t', ta.selectionStart, ta.selectionEnd, 'end');
      record(''); updateCounts();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && k.length === 1) {
      var l = k.toLowerCase();
      if (l === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (l === 'y' || (l === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
      return;
    }
    if (k.length > 1 && k !== 'Backspace' && k !== 'Delete' && k !== 'Shift' && k !== 'Control' && k !== 'Meta' && k !== 'Alt') lastKey = '';
  });
  ta.addEventListener('mousedown', function () { lastKey = ''; });

  ta.addEventListener('click', function clear() {
    if (ta.value === defaultText) { ta.value = ''; resetHist(); updateCounts(); }
    ta.removeEventListener('click', clear);
  });

  resetHist();

  /* ---- Theme settings ---- */
  function loadSettings() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch (e) {}
    if (!s) {
      var t = null;
      try { t = localStorage.getItem('ote-theme'); } catch (e) {}
      if (t === 'classic') s = { theme: 'classic' };
      else if (t === 'dark') s = { theme: 'custom', editor: 'dark', sameFooter: true, footer: 'dark' };
      else if (t === 'dark-footer') s = { theme: 'custom', editor: 'parchment', sameFooter: false, footer: 'dark' };
      else if (t === 'light') s = { theme: 'custom', editor: 'parchment', sameFooter: false, footer: 'light' };
    }
    if (!s) s = {};
    if (s.theme !== 'classic') s.theme = 'custom';
    if (s.editor !== 'light' && s.editor !== 'dark') s.editor = 'parchment';
    if (s.footer !== 'parchment' && s.footer !== 'light' && s.footer !== 'dark') s.footer = s.editor;
    s.sameFooter = s.sameFooter !== false;
    return s;
  }

  var settings = loadSettings();

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function applySettings() {
    if (settings.theme === 'classic') {
      root.setAttribute('data-theme', 'classic');
      root.removeAttribute('data-editor');
      root.removeAttribute('data-footer');
    } else {
      root.setAttribute('data-theme', 'custom');
      root.setAttribute('data-editor', settings.editor);
      root.setAttribute('data-footer', settings.sameFooter ? settings.editor : settings.footer);
    }
    syncThemeUI();
    updateCounts();
  }

  function syncThemeUI() {
    var classic = isClassic();
    var lays = doc.querySelectorAll('[data-layout-opt]');
    for (var i = 0; i < lays.length; i++) {
      var on = !classic && lays[i].getAttribute('data-layout-opt') === 'modern';
      lays[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    var eds = doc.querySelectorAll('[data-editor-opt]');
    for (var j = 0; j < eds.length; j++) {
      var onE = !classic && eds[j].getAttribute('data-editor-opt') === settings.editor;
      eds[j].setAttribute('aria-pressed', onE ? 'true' : 'false');
    }
    var fts = doc.querySelectorAll('[data-footer-opt]');
    for (var k = 0; k < fts.length; k++) {
      var onF = !classic && fts[k].getAttribute('data-footer-opt') === settings.footer;
      fts[k].setAttribute('aria-pressed', onF ? 'true' : 'false');
    }
    var cb = doc.getElementById('sameFooter');
    if (cb) cb.checked = !!settings.sameFooter;
    var fg = doc.getElementById('footerGroup');
    if (fg) fg.hidden = !!settings.sameFooter;
    var el = doc.getElementById('editorLabel');
    if (el) el.textContent = settings.sameFooter ? 'Theme' : 'Text editor theme';
  }

  var sameFooterCb = doc.getElementById('sameFooter');
  if (sameFooterCb) {
    sameFooterCb.addEventListener('change', function () {
      settings.theme = 'custom';
      settings.sameFooter = sameFooterCb.checked;
      applySettings();
      saveSettings();
    });
  }

  applySettings();
  saveSettings();

  var vv = window.visualViewport;
  if (vv) {
    var raf = 0;
    var setVvh = function () { raf = 0; root.style.setProperty('--vvh', vv.height + 'px'); };
    var sched = function () { if (!raf) raf = requestAnimationFrame(setVvh); };
    vv.addEventListener('resize', sched);
    vv.addEventListener('scroll', sched);
    setVvh();
  }
})();
</script>
</body>
</html>
